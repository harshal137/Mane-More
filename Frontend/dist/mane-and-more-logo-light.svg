<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" width="340" height="140">
  <defs>
    <!-- Gold shimmer for hair -->
    <linearGradient id="hairGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFD98A"/>
      <stop offset="40%"  stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#C8961A"/>
    </linearGradient>

    <!-- Soft white-gold for face -->
    <linearGradient id="faceLight" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#FFF5DC"/>
      <stop offset="100%" stop-color="#F0D080"/>
    </linearGradient>

    <!-- Text gradient: white → gold -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#F5C842"/>
    </linearGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFE9A0"/>
      <stop offset="100%" stop-color="#C8961A"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow for text -->
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── SILHOUETTE GROUP (left side) ── -->
  <g transform="translate(14, 4)" filter="url(#softGlow)">

    <!-- Flowing hair — main body -->
    <path d="
      M74,6
      C58,4 40,14 32,32
      C24,50 26,68 22,86
      C17,106 8,118 12,133
      C16,146 30,150 42,144
      C52,139 56,128 60,116
      C66,100 70,86 78,72
      C86,58 96,50 100,38
      C106,22 96,8 74,6 Z
    " fill="url(#hairGold)" opacity="0.97"/>

    <!-- Hair side sweep -->
    <path d="
      M28,44
      C18,58 10,76 8,94
      C6,110 10,126 18,136
      C24,144 34,148 40,142
      C32,130 24,114 22,98
      C20,84 24,70 28,58
      C32,46 36,38 34,32
      C31,30 28,36 28,44 Z
    " fill="url(#hairGold)" opacity="0.75"/>

    <!-- Outer hair wisp -->
    <path d="
      M14,78
      C6,92 2,108 4,122
      C6,134 14,144 22,142
      C16,132 12,118 12,106
      C12,94 16,84 18,76
      C16,74 14,76 14,78 Z
    " fill="#FFD98A" opacity="0.45"/>

    <!-- Face silhouette — lighter, creamy -->
    <path d="
      M70,12
      C84,9 98,18 104,32
      C110,48 108,65 100,74
      C92,82 82,84 76,92
      C72,98 70,106 68,114
      C66,120 64,128 60,132
      C56,136 48,136 44,128
      C40,120 42,108 48,100
      C54,90 62,84 64,74
      C68,62 64,46 68,32
      C70,24 68,16 70,12 Z
    " fill="url(#faceLight)" opacity="0.92"/>

    <!-- ── LEAF SPRIGS ── -->
    <!-- Stem line 1 -->
    <line x1="62" y1="74" x2="26" y2="36" stroke="#FFE08A" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
    <ellipse cx="50" cy="56" rx="11" ry="3.8" fill="url(#leafGrad)" opacity="0.9"  transform="rotate(-42,50,56)"/>
    <ellipse cx="40" cy="47" rx="10" ry="3.5" fill="#FFD060" opacity="0.85" transform="rotate(-50,40,47)"/>
    <ellipse cx="58" cy="63" rx="10" ry="3.5" fill="url(#leafGrad)" opacity="0.85" transform="rotate(-34,58,63)"/>
    <ellipse cx="32" cy="40" rx="9"  ry="3"   fill="#FFEA9A" opacity="0.75" transform="rotate(-58,32,40)"/>

    <!-- Stem line 2 -->
    <line x1="46" y1="90" x2="18" y2="56" stroke="#FFE08A" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
    <ellipse cx="38" cy="76" rx="9"  ry="3.2" fill="url(#leafGrad)" opacity="0.78" transform="rotate(-52,38,76)"/>
    <ellipse cx="28" cy="66" rx="8"  ry="3"   fill="#FFD060" opacity="0.72" transform="rotate(-58,28,66)"/>
    <ellipse cx="46" cy="84" rx="8"  ry="2.8" fill="#FFEA9A" opacity="0.7"  transform="rotate(-44,46,84)"/>

    <!-- Berry dot accents -->
    <circle cx="62" cy="36" r="2.5" fill="#FFE08A" opacity="0.9"/>
    <circle cx="56" cy="30" r="2"   fill="#FFF0B0" opacity="0.8"/>
    <circle cx="48" cy="28" r="1.8" fill="#FFD98A" opacity="0.7"/>

  </g>

  <!-- ── BRAND TEXT ── -->
  <!-- "Mane & More" in elegant italic serif, white-to-gold -->
  <text
    x="198" y="90"
    font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
    font-size="42"
    font-style="italic"
    font-weight="400"
    fill="url(#textShimmer)"
    text-anchor="middle"
    letter-spacing="1.5"
    filter="url(#textGlow)"
  >Mane &amp; More</text>

  <!-- Elegant thin rule under text -->
  <line x1="112" y1="100" x2="284" y2="100" stroke="#FFD98A" stroke-width="0.7" opacity="0.55"/>

  <!-- Tiny tagline -->
  <text
    x="198" y="116"
    font-family="'Palatino Linotype', Georgia, serif"
    font-size="10"
    font-style="normal"
    font-weight="400"
    fill="#FFE8A0"
    text-anchor="middle"
    letter-spacing="3.5"
    opacity="0.8"
  >CUT · STYLE · NOURISH</text>

</svg>
