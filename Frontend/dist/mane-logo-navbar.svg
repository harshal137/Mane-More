<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72">
  <defs>
    <!-- Gold shimmer for drop icon -->
    <linearGradient id="dropOuter" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="35%" stop-color="#C8961A"/>
      <stop offset="70%" stop-color="#A07010"/>
      <stop offset="100%" stop-color="#7A5008"/>
    </linearGradient>
    <linearGradient id="dropInner" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFBE0"/>
      <stop offset="40%" stop-color="#FFE090"/>
      <stop offset="100%" stop-color="#C8961A"/>
    </linearGradient>
    <linearGradient id="dropShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8961A"/>
      <stop offset="50%" stop-color="#A07010"/>
      <stop offset="100%" stop-color="#C8961A"/>
    </linearGradient>
    <linearGradient id="brownText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C3A10"/>
      <stop offset="100%" stop-color="#3A2008"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#C8961A" flood-opacity="0.35"/>
    </filter>
    <filter id="textShadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" flood-color="#C8961A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- DROP ICON — tight, no excess padding -->
  <g transform="translate(2, 4)" filter="url(#dropShadow)">
    <!-- Outer gold drop shape -->
    <path d="
      M28,4
      C22,4 14,10 10,18
      C6,26 6,35 10,42
      C14,50 22,55 28,55
      C34,55 42,50 46,42
      C50,35 50,26 46,18
      C42,10 34,4 28,4 Z
    " fill="url(#dropOuter)"/>

    <!-- Inner cream highlight -->
    <path d="
      M28,10
      C24,10 18,15 16,21
      C14,27 15,34 19,39
      C22,43 26,46 28,46
      C32,46 36,42 39,37
      C42,32 42,25 39,20
      C36,14 32,10 28,10 Z
    " fill="url(#dropInner)" opacity="0.75"/>

    <!-- Shine highlight top-left -->
    <ellipse cx="20" cy="18" rx="6" ry="4" fill="url(#dropShine)" opacity="0.9" transform="rotate(-30,20,18)"/>

    <!-- Sparkle stars -->
    <!-- Big sparkle -->
    <g transform="translate(14,14)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
      <line x1="-3" y1="-3" x2="3" y2="3" stroke="#fff" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
      <line x1="3" y1="-3" x2="-3" y2="3" stroke="#fff" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
    </g>
    <!-- Small sparkle -->
    <g transform="translate(22,10)">
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#fff" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#fff" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
    </g>
    <!-- Tiny sparkle -->
    <g transform="translate(18,26)">
      <line x1="0" y1="-2" x2="0" y2="2" stroke="#fff" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
      <line x1="-2" y1="0" x2="2" y2="0" stroke="#fff" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
    </g>
    <!-- Dot accents -->
    <circle cx="24" cy="13" r="1.2" fill="#fff" opacity="0.8"/>
    <circle cx="27" cy="11" r="0.8" fill="#fff" opacity="0.6"/>
    <circle cx="22" cy="16" r="0.7" fill="#fff" opacity="0.55"/>

    <!-- Flowing swirl lines inside drop -->
    <path d="M20,30 Q26,24 34,32 Q38,36 34,42" fill="none" stroke="#C8961A" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
    <path d="M22,36 Q28,30 36,36" fill="none" stroke="#A07010" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- TEXT GROUP — starts right after icon -->
  <g transform="translate(60, 8)" filter="url(#textShadow)">
    <!-- "Mane" in brown -->
    <text
      x="0" y="34"
      font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
      font-size="30"
      font-style="italic"
      font-weight="700"
      fill="url(#brownText)"
      letter-spacing="0.5"
    >Mane</text>

    <!-- " & More" in gold -->
    <text
      x="80" y="34"
      font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
      font-size="30"
      font-style="italic"
      font-weight="700"
      fill="url(#goldText)"
      letter-spacing="0.5"
    >&amp; More</text>

    <!-- Decorative divider line with center ornament -->
    <line x1="0" y1="40" x2="270" y2="40" stroke="#C8961A" stroke-width="0.6" opacity="0.6"/>
    <!-- Center diamond ornament -->
    <polygon points="135,37 138,40 135,43 132,40" fill="#C8961A" opacity="0.7"/>

    <!-- Tagline -->
    <text
      x="135" y="54"
      font-family="'Palatino Linotype',Georgia,serif"
      font-size="9"
      font-style="normal"
      font-weight="400"
      fill="#A07010"
      text-anchor="middle"
      letter-spacing="4"
      opacity="0.85"
    >CUT · STYLE · NOURISH</text>
  </g>
</svg>
